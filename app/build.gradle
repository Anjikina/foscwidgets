plugins { id 'com.android.application' }
def signingFile = System.getenv('FOSC_KEYSTORE_FILE')
def signingPassword = System.getenv('FOSC_KEYSTORE_PASSWORD')
android {
    namespace 'be.foscwidgets'
    compileSdk 35
    defaultConfig {
        applicationId 'be.foscwidgets'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.3.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (signingFile && signingPassword) {
                storeFile file(signingFile)
                storePassword signingPassword
                keyAlias 'foscwidgets'
                keyPassword signingPassword
            }
        }
    }
    buildTypes { release { if (signingFile && signingPassword) signingConfig signingConfigs.release } }
    lint { abortOnError true }
}
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
